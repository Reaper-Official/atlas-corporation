<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manuizine : Le Champion des configs bancales - Atlas Corporation</title>
    <meta name="description" content="Analyse critique satirique des configurations de Manuizine.">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="https://atlas-corporation.fr/favicon.ico">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Colors */
            --primary: #1a1a1a;
            --secondary: #f8fafc;
            --accent: #1ad309;
            --accent-hover: #59df00bd;
            --accent-light: #13eb0c;
            --success: #10b981;
            --warning: #076b18;
            --error: #ef4444;
            --white: #ffffff;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --gray-900: #111827;
            
            /* Typography */
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-mono: 'JetBrains Mono', 'SF Mono', 'Monaco', 'Cascadia Code', monospace;
            
            /* Layout */
            --header-height: 64px;
            
            /* Shadows & Effects */
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
            
            /* Transitions */
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: var(--font-sans);
            font-size: 16px;
            line-height: 1.6;
            color: var(--gray-900);
            background: var(--white);
            overflow-x: hidden;
        }

        /* Background Pattern */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="25" cy="25" r="1" fill="%23fcd34d" opacity="0.1"/><circle cx="75" cy="75" r="0.5" fill="%23f59e0b" opacity="0.1"/><circle cx="50" cy="10" r="0.8" fill="%23d97706" opacity="0.05"/></pattern></defs><rect width="100%" height="100%" fill="url(%23grain)"/></svg>');
            pointer-events: none;
            z-index: -1;
        }

        /* Header */
        .header {
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid var(--gray-200);
            z-index: 1000;
            transition: var(--transition);
        }

        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem;
            height: var(--header-height);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: var(--gray-900);
            font-weight: 800;
            font-size: 1.25rem;
            transition: var(--transition);
        }

        .logo:hover {
            color: var(--accent);
            transform: scale(1.02);
        }

        .logo-icon {
            width: 2.5rem;
            height: 2.5rem;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.25rem;
            box-shadow: var(--shadow-md);
        }

        .header-cta {
            background: var(--accent);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.875rem;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }

        .header-cta:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        .center-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 20px;
        }

        .home-button {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(145deg, #ffffff, #f0f0f0);
            color: #333;
            text-decoration: none;
            padding: 16px 32px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            box-shadow: 
                0 8px 25px rgba(0, 0, 0, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .home-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .home-button:hover {
            transform: translateY(-3px);
            box-shadow: 
                0 12px 35px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);
            border-color: #667eea;
        }

        .home-button:hover::before {
            left: 100%;
        }

        .home-button:active {
            transform: translateY(-1px);
            box-shadow: 
                0 6px 20px rgba(0, 0, 0, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.7);
        }

        .home-icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Hero Section */
        .hero {
            padding: 4rem 0;
            background: linear-gradient(135deg, #fffbeb 0%, var(--white) 100%);
            text-align: center;
            border-bottom: 1px solid var(--gray-200);
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--error);
            margin-bottom: 1.5rem;
        }

        .hero-title {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 900;
            line-height: 1.1;
            color: var(--gray-900);
            margin-bottom: 1.5rem;
        }

        .hero-title .highlight {
            background: linear-gradient(135deg, var(--error) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-description {
            font-size: 1.25rem;
            color: var(--gray-600);
            max-width: 700px;
            margin: 0 auto 2rem;
        }

        /* Satirical Note */
        .satirical-note {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.1) 0%, rgba(245, 158, 11, 0.05) 100%);
            border: 2px solid var(--error);
            border-radius: 1rem;
            padding: 2rem;
            margin: 2rem 0;
            text-align: center;
        }

        .satirical-note h3 {
            color: var(--error);
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }

        .satirical-note p {
            color: var(--gray-700);
            font-style: italic;
        }

        /* Section Cards */
        .section-card {
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: 1.5rem;
            padding: 2.5rem;
            margin: 2rem 0;
            box-shadow: var(--shadow);
            transition: var(--transition-slow);
            position: relative;
            overflow: hidden;
        }

        .section-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--error) 0%, var(--accent) 100%);
            transform: scaleX(0);
            transition: var(--transition-slow);
        }

        .section-card:hover::before {
            transform: scaleX(1);
        }

        .section-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-xl);
            border-color: var(--error);
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .section-icon {
            width: 3rem;
            height: 3rem;
            background: linear-gradient(135deg, var(--warning) 0%, var(--accent) 100%);
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
            box-shadow: var(--shadow-md);
        }

        .section-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--gray-900);
        }

        .section-subtitle {
            color: var(--gray-600);
            font-size: 1rem;
            margin-top: 0.25rem;
        }

        /* Power Calculation Box */
        .power-calc {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.05), rgba(245, 158, 11, 0.05));
            border: 2px solid var(--error);
            border-radius: 1rem;
            padding: 2rem;
            margin: 2rem 0;
        }

        .power-calc h4 {
            color: var(--error);
            font-size: 1.5rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .calc-table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
            background: white;
            border-radius: 0.5rem;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .calc-table th, .calc-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--gray-200);
        }

        .calc-table th {
            background: var(--gray-50);
            font-weight: 600;
            color: var(--gray-900);
        }

        .calc-table .danger {
            color: var(--error);
            font-weight: bold;
        }

        .calc-table .total-row {
            background: rgba(239, 68, 68, 0.1);
            font-weight: bold;
        }

        /* Warning Box */
        .warning-box {
            background: linear-gradient(135deg, var(--error) 0%, #dc2626 100%);
            color: white;
            padding: 2rem;
            border-radius: 1rem;
            margin: 2rem 0;
            text-align: center;
            box-shadow: var(--shadow-lg);
            animation: warning-pulse 2s ease-in-out infinite;
        }

        @keyframes warning-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .warning-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        /* Video Container */
        .video-container {
            background: var(--gray-50);
            border: 1px solid var(--gray-200);
            border-radius: 1rem;
            padding: 2rem;
            margin: 2rem 0;
            text-align: center;
        }

        .video-container h4 {
            color: var(--gray-900);
            margin-bottom: 1rem;
            font-size: 1.25rem;
            font-weight: 600;
        }

        .video-container video {
            width: 100%;
            max-width: 800px;
            height: auto;
            border-radius: 0.75rem;
            box-shadow: var(--shadow-lg);
        }

        .video-warning {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: var(--error);
            padding: 1rem;
            border-radius: 0.5rem;
            margin-top: 1rem;
            font-weight: 500;
        }

        /* Quote Box */
        .quote-box {
            background: linear-gradient(135deg, var(--warning) 0%, var(--accent) 100%);
            color: white;
            padding: 2.5rem;
            border-radius: 1.5rem;
            margin: 2rem 0;
            text-align: center;
            font-size: 1.25rem;
            font-weight: 600;
            font-style: italic;
            position: relative;
            box-shadow: var(--shadow-lg);
        }

        .quote-box::before {
            content: '"';
            font-size: 4rem;
            position: absolute;
            top: -10px;
            left: 20px;
            opacity: 0.3;
        }

        .quote-box::after {
            content: '"';
            font-size: 4rem;
            position: absolute;
            bottom: -30px;
            right: 20px;
            opacity: 0.3;
        }

        /* Problems List */
        .problems-list {
            list-style: none;
            padding: 0;
            margin: 2rem 0;
        }

        .problems-list li {
            background: rgba(239, 68, 68, 0.05);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 0.75rem;
            padding: 1.5rem;
            margin-bottom: 1rem;
            position: relative;
            padding-left: 3rem;
        }

        .problems-list li::before {
            content: '⚠️';
            position: absolute;
            left: 1rem;
            top: 15px;
            font-size: 1.5rem;
        }

        .problems-list li strong {
            color: var(--error);
        }

        /* Summary Box */
        .summary-box {
            background: linear-gradient(135deg, var(--error) 0%, #dc2626 100%);
            color: white;
            padding: 2.5rem;
            border-radius: 1.5rem;
            margin: 3rem 0;
            text-align: center;
            box-shadow: var(--shadow-xl);
        }

        .summary-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .summary-content {
            font-size: 1.125rem;
            line-height: 1.7;
        }

        /* Disclaimer */
        .disclaimer {
            background: var(--gray-50);
            border: 1px solid var(--gray-200);
            border-radius: 1rem;
            padding: 2rem;
            margin: 3rem 0;
            color: var(--gray-600);
            font-size: 0.875rem;
            line-height: 1.6;
            text-align: center;
        }

        .disclaimer h3 {
            color: var(--gray-900);
            margin-bottom: 1rem;
            font-size: 1.25rem;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 0 1rem;
            }

            .nav {
                padding: 1rem;
            }

            .hero {
                padding: 3rem 0;
            }

            .section-card {
                padding: 1.5rem;
            }

            .section-header {
                flex-direction: column;
                text-align: center;
                gap: 0.5rem;
            }

            .calc-table {
                font-size: 0.875rem;
            }

            .calc-table th, .calc-table td {
                padding: 0.5rem;
            }

            .quote-box {
                font-size: 1.125rem;
                padding: 2rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <nav class="nav">
            <a href="#" class="logo">
                <div class="logo-icon">⚡</div>
                <span>Atlas Corporation</span>
            </a>
            <a href="https://atlas-corporation.fr/critique-des-idiots" class="header-cta">
                ← Retour au Hub
            </a>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="container">
            <div class="hero-badge">
                ⚠️ <span>DANGER - Configuration à Risque</span>
            </div>
            
            <div class="center-container">
                <a href="https://atlas-corporation.fr" class="home-button">
                    <svg class="home-icon" viewBox="0 0 24 24">
                        <path d="M12 2L2 12h3v8h6v-6h2v6h6v-8h3L12 2z"/>
                    </svg>
                    Retour à l'accueil
                </a>
            </div>

            <h1 class="hero-title">
                <span class="highlight">Benjy_Hardware</span> : L'Hardware Française n'a qu'à bien se tenir !
            </h1>

            
        </div>
    </section>

    <main>

        
    </main>

    <script>
        // Smooth scrolling for internal links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            });
        });

        // Header scroll effect
        window.addEventListener('scroll', () => {
            const header = document.querySelector('.header');
            if (window.scrollY > 100) {
                header.style.background = 'rgba(255, 255, 255, 0.98)';
                header.style.backdropFilter = 'blur(30px) saturate(200%)';
            } else {
                header.style.background = 'rgba(255, 255, 255, 0.95)';
                header.style.backdropFilter = 'blur(20px) saturate(180%)';
            }
        });

        // Card hover effects with enhanced animation
        document.querySelectorAll('.section-card').forEach(card => {
            card.addEventListener('mouseenter', () => {
                card.style.transform = 'translateY(-4px)';
                card.style.boxShadow = 'var(--shadow-xl)';
            });
            
            card.addEventListener('mouseleave', () => {
                card.style.transform = 'translateY(0)';
                card.style.boxShadow = 'var(--shadow)';
            });
        });

        // Intersection Observer for fade-in animations
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0)';
                }
            });
        }, observerOptions);

        // Apply fade-in animation to elements
        document.querySelectorAll('.section-card, .satirical-note, .summary-box, .power-calc').forEach(element => {
            element.style.opacity = '0';
            element.style.transform = 'translateY(30px)';
            element.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
            observer.observe(element);
        });

        // Warning box pulse effect
        const warningBoxes = document.querySelectorAll('.warning-box');
        warningBoxes.forEach(box => {
            box.addEventListener('mouseenter', () => {
                box.style.animationDuration = '0.5s';
            });
            box.addEventListener('mouseleave', () => {
                box.style.animationDuration = '2s';
            });
        });

        // Easter egg: click on lightning icons for fun
        document.querySelectorAll('.section-icon').forEach(icon => {
            icon.addEventListener('click', () => {
                icon.style.transform = 'rotate(360deg) scale(1.5)';
                icon.style.filter = 'drop-shadow(0 0 20px var(--accent))';
                setTimeout(() => {
                    icon.style.transform = '';
                    icon.style.filter = '';
                }, 1000);
            });
        });

        // Power calculation highlighting
        const calcRows = document.querySelectorAll('.calc-table tr');
        calcRows.forEach(row => {
            row.addEventListener('mouseenter', () => {
                row.style.backgroundColor = 'rgba(239, 68, 68, 0.1)';
                row.style.transform = 'scale(1.02)';
            });
            row.addEventListener('mouseleave', () => {
                row.style.backgroundColor = '';
                row.style.transform = 'scale(1)';
            });
        });

        console.log('⚡ Manuizine Power Analysis - Atlas Corporation (Warning Mode) ⚡');
        console.log('Configuration analysée: RTX 5080 + 7800X3D + 750W PSU');
        console.log('Verdict: 🚨 CONFIGURATION À RISQUE 🚨');
    </script>
</body>
</html>
