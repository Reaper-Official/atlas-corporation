<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FrenchHardware : Masterclass en Incohérence - Analyse Critique Atlas Corporation</title>
    <meta name="description" content="Atlas Corporation dévoile les contradictions de FrenchHardware/FlowUp: SSD NVMe plus lents que des HDD, benchmarks fantaisistes, produits critiqués puis vendus, et installations défiant la physique. Une analyse satirique et documentée de leurs incohérences tech.">

    <meta http-equiv="refresh" content="5;url=https://atlas-corporation.fr">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            animation: fadeIn 1s ease-out;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #fff, #e0e0e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .section-title {
            font-size: 1.8rem;
            margin-bottom: 2rem;
            color: #f0f0f0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .message {
            font-size: 1.3rem;
            margin-bottom: 2rem;
            line-height: 1.6;
            color: #e0e0e0;
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.7;
            animation: float 3s ease-in-out infinite;
        }

        .redirect-info {
            font-size: 1rem;
            margin-top: 2rem;
            color: #b0b0b0;
            font-style: italic;
        }

        .loading-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            margin-top: 1rem;
            overflow: hidden;
        }

        .loading-progress {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #45a049);
            width: 0%;
            animation: loadingProgress 5s linear forwards;
        }
		        /* Image Sections */
        .image-section img, .flowup-image, .corsair-image, .benchmark-image {
            max-width: 100%;
            width: 100%;
            height: auto;
            object-fit: contain;
            border-radius: 1rem;
            box-shadow: var(--shadow-lg);
            transition: var(--transition);
            margin: 1rem 0;
        }

        .image-section img:hover, .flowup-image:hover, .corsair-image:hover, .benchmark-image:hover {
            transform: scale(1.02);
            box-shadow: var(--shadow-xl);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes loadingProgress {
            from {
                width: 0%;
            }
            to {
                width: 100%;
            }
        }

        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: particleFloat 6s infinite linear;
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="particles">
        <div class="particle" style="left: 10%; width: 4px; height: 4px; animation-delay: 0s;"></div>
        <div class="particle" style="left: 20%; width: 2px; height: 2px; animation-delay: 1s;"></div>
        <div class="particle" style="left: 30%; width: 3px; height: 3px; animation-delay: 2s;"></div>
        <div class="particle" style="left: 40%; width: 5px; height: 5px; animation-delay: 3s;"></div>
        <div class="particle" style="left: 50%; width: 2px; height: 2px; animation-delay: 4s;"></div>
        <div class="particle" style="left: 60%; width: 4px; height: 4px; animation-delay: 5s;"></div>
        <div class="particle" style="left: 70%; width: 3px; height: 3px; animation-delay: 2.5s;"></div>
        <div class="particle" style="left: 80%; width: 2px; height: 2px; animation-delay: 1.5s;"></div>
        <div class="particle" style="left: 90%; width: 4px; height: 4px; animation-delay: 3.5s;"></div>
    </div>

    <div class="container">
        <div class="logo">ATLAS CORPORATION</div>
        <div class="section-title">Guillaume</div>
        
        <img src="https://atlas-corporation.fr/img/imgppguillaume.png" alt="Rire FrenchHardware" class="benchmark-image">
        
        <div class="message">
            La page a été redirigée à un autre emplacement.<br>
            Redrection en cours...
        </div>
        
        <div class="redirect-info">
            Redirection automatique vers la page souhaitée...
        </div>
        
        <div class="loading-bar">
            <div class="loading-progress"></div>
        </div>
    </div>

    <script>
        // Redirection manuelle au cas où la meta refresh ne fonctionnerait pas
        setTimeout(() => {
            window.location.href = 'https://atlas-corporation.fr/critique-des-idiots/guillaume/';
        }, 5000);

        // Effet de clic pour redirection immédiate
        document.addEventListener('click', () => {
            window.location.href = 'https://atlas-corporation.fr/critique-des-idiots/guillaume/';
        });

        // Ajouter plus de particules dynamiquement
        function createParticle() {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.width = Math.random() * 4 + 2 + 'px';
            particle.style.height = particle.style.width;
            particle.style.animationDelay = Math.random() * 6 + 's';
            document.querySelector('.particles').appendChild(particle);

            // Supprimer la particule après l'animation
            setTimeout(() => {
                particle.remove();
            }, 6000);
        }

        // Créer des particules en continu
        setInterval(createParticle, 800);
    </script>
</body>
</html>
