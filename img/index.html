<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Galerie — Atlas Corporation</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --primary:#1a1a1a;
      --accent:#3b82f6;
      --accent-hover:#2563eb;
      --accent-light:#60a5fa;
      --white:#ffffff;
      --gray-50:#f9fafb;
      --gray-100:#f3f4f6;
      --gray-200:#e5e7eb;
      --gray-300:#d1d5db;
      --gray-400:#9ca3af;
      --gray-500:#6b7280;
      --gray-700:#374151;
      --gray-900:#111827;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 6px 18px -8px rgba(0,0,0,0.15);
      --shadow-lg: 0 12px 30px -12px rgba(0,0,0,0.18);
      --transition: all .22s cubic-bezier(.2,.9,.3,1);
      --card-radius: 1rem;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      font-family:var(--font-sans);
      background:linear-gradient(135deg,var(--gray-50),var(--white));
      color:var(--gray-900);
      min-height:100vh;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    /* header */
    .header{
      position:sticky;top:0;z-index:60;
      background:rgba(255,255,255,0.86);
      backdrop-filter: blur(8px);
      border-bottom:1px solid var(--gray-200);
      padding:1.5rem 2.5rem;
    }
    .header .row{display:flex;align-items:center;gap:.75rem}
    .logo{display:flex;align-items:center;gap:.75rem;text-decoration:none;color:var(--gray-900);font-weight:800;font-size:1.25rem}
    .logo-icon{width:3rem;height:3rem;border-radius:.75rem;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--accent),var(--accent-light));box-shadow:var(--shadow-md)}
    .subtitle{color:var(--gray-500);font-size:.9rem;margin-top:.35rem}

    /* main */
    .main-content{max-width:1400px;margin:2.25rem auto;padding:0 1.25rem}
    .page-title{font-size:2.4rem;font-weight:900;margin-bottom:.75rem}
    /* filter controls */
    .filter-controls{display:flex;gap:.75rem;justify-content:center;margin-bottom:1.5rem;flex-wrap:wrap}
    .filter-btn{
      background:white;border:1px solid var(--gray-200);padding:.5rem 1rem;border-radius:999px;font-weight:700;cursor:pointer;
      box-shadow:var(--shadow-sm);transition:var(--transition);color:var(--gray-700)
    }
    .filter-btn:hover{transform:translateY(-3px)}
    .filter-btn.active{background:linear-gradient(90deg,var(--accent),var(--accent-light));color:white;border-color:rgba(255,255,255,0.2);box-shadow:var(--shadow-lg)}

    /* gallery grid */
    .gallery-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
      gap:1rem;
      align-items:start;
    }

    .card{
      background:white;border-radius:var(--card-radius);overflow:hidden;border:1px solid var(--gray-200);
      box-shadow:var(--shadow-sm);cursor:pointer;transition:var(--transition);display:flex;flex-direction:column;
    }
    .card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg)}
    .card-figure{
      height:140px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--gray-100),var(--gray-50));position:relative;overflow:hidden;
    }
    .card-figure img{max-width:100%;max-height:100%;object-fit:cover;display:block}
    .card-caption{padding:.6rem .75rem;display:flex;align-items:center;gap:.5rem;justify-content:space-between}
    .filename{font-size:.9rem;font-weight:600;color:var(--gray-700);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
    .btn-ghost{border:1px solid var(--gray-200);background:white;padding:.35rem .6rem;border-radius:.5rem;font-size:.82rem;cursor:pointer;font-weight:600}
    .btn-ghost:hover{background:var(--gray-50);border-color:var(--accent)}

    /* video card look */
    .card.video .card-figure{background:linear-gradient(135deg,#111827,#374151);height:140px;color:white}
    .video-thumb{
      position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;
    }
    .video-badge{
      position:absolute;left:8px;top:8px;background:rgba(0,0,0,0.35);backdrop-filter:blur(3px);padding:.25rem .45rem;border-radius:.4rem;font-weight:700;font-size:.78rem;color:white;border:1px solid rgba(255,255,255,0.06)
    }
    .play-icon{
      width:64px;height:64px;display:flex;align-items:center;justify-content:center;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,0.04),rgba(255,255,255,0.02));box-shadow:0 6px 20px rgba(0,0,0,0.35);
      transition:transform .25s ease;
    }
    .card.video:hover .play-icon{transform:scale(1.08)}
    .play-icon svg{width:36px;height:36px;stroke:white;stroke-width:1;fill:white;opacity:0.95}

    /* separator (spans full grid) */
    .separator{
      grid-column: 1 / -1;
      display:flex;align-items:center;justify-content:center;padding:1rem 0;margin:0;
      position:relative;
    }
    .separator::before{
      content:"";position:absolute;left:4%;right:4%;height:2px;background:linear-gradient(90deg,transparent,var(--accent-light),var(--accent),transparent);filter:blur(2px);opacity:.85;
      transform:translateY(0);
      box-shadow:0 0 18px rgba(59,130,246,0.18);
      animation:pulse 3.8s ease-in-out infinite;
    }
    @keyframes pulse{0%{opacity:.6}50%{opacity:1}100%{opacity:.6}}
    .separator .sep-label{position:relative;background:white;padding:.25rem .9rem;border-radius:999px;font-weight:800;color:var(--gray-700);border:1px solid var(--gray-100)}

    /* lightbox */
    .lightbox{display:none;position:fixed;inset:0;background:rgba(2,6,23,0.85);z-index:1200;align-items:center;justify-content:center;padding:2rem}
    .lightbox.active{display:flex}
    .lightbox-inner{max-width:92%;max-height:92%;position:relative;display:flex;flex-direction:column;align-items:center;gap:.6rem}
    .lightbox-media{max-width:100%;max-height:80vh;border-radius:.6rem;box-shadow:0 20px 60px rgba(0,0,0,0.65)}
    .lightbox-close{position:absolute;right:-.8rem;top:-.8rem;background:white;border-radius:50%;width:44px;height:44px;border:none;cursor:pointer;box-shadow:var(--shadow-md);font-weight:800}
    .lightbox-close:hover{background:var(--accent);color:white;transform:rotate(25deg)}
    .lightbox-info{display:flex;gap:.6rem;align-items:center;background:white;padding:.5rem .75rem;border-radius:.5rem}
    .lightbox-filename{font-family:var(--font-mono);font-weight:700;color:var(--gray-700)}

    /* toast */
    .toast{position:fixed;top:20px;right:20px;background:var(--accent);color:white;padding:.6rem .95rem;border-radius:.5rem;box-shadow:var(--shadow-lg);font-weight:700;z-index:1300;transform:translateY(-6px);opacity:0;animation:toastIn .35s forwards}
    @keyframes toastIn{to{opacity:1;transform:translateY(0)}}

    /* responsive tweaks */
    @media(max-width:720px){
      .card-figure{height:120px}
      .gallery-grid{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
      .page-title{font-size:1.8rem}
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="row">
      <a class="logo" href="https://atlas-corporation.fr">
        <div class="logo-icon"><img src="https://atlas-corporation.fr/favicon.ico" alt="Atlas" width="24" style="display:block"></div>
        Atlas Corporation
      </a>
    </div>
    <p class="subtitle">Galerie d'images et vidéos</p>
  </header>

  <main class="main-content">
    <h1 class="page-title">Galerie</h1>

    <div class="filter-controls" aria-label="Filtrer la galerie">
      <button class="filter-btn active" data-filter="all">Les deux</button>
      <button class="filter-btn" data-filter="images">Images</button>
      <button class="filter-btn" data-filter="videos">Vidéos</button>
    </div>

    <section class="gallery-grid" id="gallery" aria-live="polite"></section>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="lightbox-inner" id="lightbox-inner"></div>
  </div>

  <footer style="text-align:center;padding:2.5rem 1rem;background:rgba(255,255,255,0.85);backdrop-filter:blur(6px);border-top:1px solid #eee;">
    <small style="color:var(--gray-600)">&copy; 2025 Atlas Corporation. Tous droits réservés.</small>
  </footer>

  <script>
    // mapping noms lisibles
    const fileDisplayNames = {
      // Images
      "write-over-timem480pro.png": "SSD M480 Pro Graph",
      "write-over-time.png": "SSD Kingston NV3 Graph",
      "write-over-tim2e.png": "SSD Kingston NV2 Graph",
      "write-over-tim3e.png": "SSD Kingston KC3000 Graph",
      "txtraykopub.jpg": "Texte Rayko PUB FH Discord",
      "srayko.png": "Profil Rayko Infinytech",
      "solotechphoto.png": "SoloTech Photo",
      "serverrayko3.png": "Server InfinyTech Bazzard 3",
      "serverrayko2.png": "Server InfinyTech Bazzard 2",
      "serverrayko1.png": "Server InfinyTech Bazzard 1",
      "screen.svg": "Image Taille Écrans",
      "preuvebanmassif.png": "Preuve Ban Massifs FH Discord",
      "pcinoxtagmur.png": "PC Inoxtag Mur",
      "paxphoto.png": "PAX Photo",
      "p3stability.png": "SSD Crucial(s) Graph",
      "p3reality.png": "P3 Graph Copie Windows",
      "mp700elitecorsaire.png": "SSD Corsair MP700 Elite",
      "mp600corextcorsaire.png": "SSD Corsair MP600 CORE XT",
      "manuizinephoto.png": "Manuizine Photo",
      "imgppguillaume.png": "Guillaume Photo",
      "imgppfrenchhardwarerire.png": "FrenchHardware Photo Rire",
      "h&co(3).png": "Image RAM Hardware And Co 3",
      "h&co(2).png": "Image RAM Hardware And Co 2",
      "h&co(1).png": "Image RAM Hardware And Co 1",
      "flowuppcdebunkbench.png": "PC Flowup Benchmark Preuve",
      "configimg.png": "Flowup PC Sur Mesure Horreur",
      "benjyhardwaredefendcorsair.png": "Benjy_Hardware qui défend Corsair",
      "benjy_hardware.png": "Benjy_Hardware Photo",
      "aioexplications.jpg": "Image Watercooling Explication Montage",
      "FlowupPageweb.png": "PC Flowup Benchmark Site Base",
      "FlowupCorsair3.png": "PC RAM Corsair Flowup 3",
      "FlowupCorsair2.png": "PC RAM Corsair Flowup 2",
      "FlowupCorsair1.png": "PC RAM Corsair Flowup 1",
      "Flowup120mmprove.png": "PC Watercooling 120mm Expliqué",
      "Flowup120mm.png": "PC Watercooling 120mm Base",
      "FH14700KFbench.png": "Benchmark 14700KF Flowup",
      "CEsiteIntel14700KF.png": "Site Intel 14700KF",
      "900votants.png": "Sondage Intel IA MAX Votants",
      "80plusratings.jpg": "Norme 80 Plus Graph",
      "59votants.png": "Sondage Intel IA MIN votants",
      "120mmflowup.png": "PC 120mm Flowup",
      "fhfrontmerch.png": "FH Front Merch",
      // Vidéos
      "120mm_tqt(1).mp4": "FrenchHardware 1200mm Moyen",
      "14juilletvideo.mp4": "Vidéo 14 Juillet",
      "benjyhardwarecollabcorsair.mp4": "Benjy_Hardware Promo Corsair (Ram Inclus)",
      "benjyhardwarejugementconfigavecramcorsair.mp4": "Benjy_Hardware Non Critique Ram Corsair",
      "benjyhardwarequizz1.mp4": "Benjy_Hardware Quizz Ridicule 1",
      "benjyhardwarequizz2.mp4": "Benjy_Hardware Quizz Ridicule 2",
      "FlowupErrorBench2.mp4": "Flowup BenchMark 5080 & 7800X3D Avec Intel",
      "FlowupErrorBenchmark1.mp4": "Flowup BenchMark 9060XT = 5090 ?",
      "FrHardwareAutoDebunk(1).mp4": "FrenchHardware Critique Corsair (Ram)",
      "guillaumevideoscandaleuse.mp4": "Guillaume Promo Corsair (XD)",
      "Inoxtagpcpreuve.mp4": "Preuve Discord Haine Inoxtag FrenchHardware",
      "manuizinetiktok.mp4": "Manuizine 750W & 5080",
      "paxenormedingueries.mp4": "Pax Norme 80 + Non connu",
      "pcanymedebunk.mp4": "FrenchHardware PC Anyme",
      "solotecherrorbench(1).mp4": "Solotech Bride Tests 30 FPS"
    };

    // listes complètes (issues du fichier d'origine)
    const filenames = [
      "120mmflowup.png","59votants.png","80plusratings.jpg","900votants.png","CEsiteIntel14700KF.png","FH14700KFbench.png","Flowup120mm.png","Flowup120mmprove.png","FlowupCorsair1.png","FlowupCorsair2.png","FlowupCorsair3.png","FlowupPageweb.png","aioexplications.jpg","benjy_hardware.png","benjyhardwaredefendcorsair.png","configimg.png","fhfrontmerch.png","flowuppcdebunkbench.png","h&co(1).png","h&co(2).png","h&co(3).png","imgppfrenchhardwarerire.png","imgppguillaume.png","manuizinephoto.png","mp600corextcorsaire.png","mp700elitecorsaire.png","p3reality.png","p3stability.png","paxphoto.png","pcinoxtagmur.png","preuvebanmassif.png","screen.svg","serverrayko1.png","serverrayko2.png","serverrayko3.png","solotechphoto.png","srayko.png","txtraykopub.jpg","write-over-tim2e.png","write-over-tim3e.png","write-over-time.png","write-over-timem480pro.png"
    ];

    const videoFilenames = [
      "120mm_tqt(1).mp4","14juilletvideo.mp4","benjyhardwarecollabcorsair.mp4","benjyhardwarejugementconfigavecramcorsair.mp4","benjyhardwarequizz1.mp4","benjyhardwarequizz2.mp4","FlowupErrorBench2.mp4","FlowupErrorBenchmark1.mp4","FrHardwareAutoDebunk(1).mp4","guillaumevideoscandaleuse.mp4","Inoxtagpcpreuve.mp4","manuizinetiktok.mp4","paxenormedingueries.mp4","pcanymedebunk.mp4","solotecherrorbench(1).mp4"
    ];

    const base = 'https://atlas-corporation.fr/img/';
    const videoBase = 'https://fichiers.atlas-corporation.fr/videostock/';

    const gallery = document.getElementById('gallery');
    const lightbox = document.getElementById('lightbox');
    const lightboxInner = document.getElementById('lightbox-inner');

    // utils
    function safeEncode(name){ return encodeURIComponent(name).replace(/%20/g, '+'); }
    function createImageCard(name){
      const src = base + safeEncode(name);
      const card = document.createElement('article');
      card.className = 'card';
      card.setAttribute('data-type','image');
      card.onclick = () => openLightbox(src, name, false);

      card.innerHTML = `
        <figure class="card-figure">
          <img src="${src}" alt="${escapeHtml(fileDisplayNames[name] || name)}" loading="lazy" onerror="this.style.opacity='.25'"/>
        </figure>
        <div class="card-caption">
          <span class="filename">${escapeHtml(fileDisplayNames[name] || name)}</span>
          <button class="btn-ghost" onclick="event.stopPropagation(); copyUrl('${src}')">Copier</button>
        </div>
      `;
      return card;
    }

    function createVideoCard(name){
      const src = videoBase + safeEncode(name);
      const card = document.createElement('article');
      card.className = 'card video';
      card.setAttribute('data-type','video');
      card.onclick = () => openLightbox(src, name, true);

      // attempt poster fetch isn't available, so we keep a stylized thumbnail
      card.innerHTML = `
        <figure class="card-figure">
          <div class="video-thumb" aria-hidden="true">
            <div class="play-icon" title="Lire la vidéo">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            </div>
          </div>
          <div class="video-badge">VIDÉO</div>
        </figure>
        <div class="card-caption">
          <span class="filename">${escapeHtml(fileDisplayNames[name] || name)}</span>
          <button class="btn-ghost" onclick="event.stopPropagation(); copyUrl('${src}')">Copier</button>
        </div>
      `;
      return card;
    }

    // render functions
    function loadGallery(filter='all'){
      gallery.innerHTML = '';
      const showImages = filter === 'all' || filter === 'images';
      const showVideos = filter === 'all' || filter === 'videos';

      if (showImages) {
        filenames.forEach(name => {
          gallery.appendChild(createImageCard(name));
        });
      }

      // si affiche les deux, ajouter séparateur stylé
      if (showImages && showVideos) {
        const sep = document.createElement('div');
        sep.className = 'separator';
        sep.innerHTML = `<div class="sep-label">Vidéos</div>`;
        gallery.appendChild(sep);
      }

      if (showVideos) {
        videoFilenames.forEach(name => {
          gallery.appendChild(createVideoCard(name));
        });
      }
    }

    // lightbox open/close
    let activeMedia = null;
    function openLightbox(src, filename, isVideo){
      activeMedia = {src, filename, isVideo};
      lightboxInner.innerHTML = `
        <div style="position:relative;display:flex;flex-direction:column;align-items:center;">
          <button class="lightbox-close" aria-label="Fermer" onclick="closeLightbox()">✕</button>
          ${isVideo
            ? `<video class="lightbox-media" controls autoplay playsinline>
                 <source src="${src}" type="video/mp4">
                 Votre navigateur ne supporte pas la vidéo.
               </video>`
            : `<img class="lightbox-media" src="${src}" alt="${escapeHtml(fileDisplayNames[filename] || filename)}">`
          }
          <div class="lightbox-info" style="margin-top:.6rem;">
            <div style="display:flex;align-items:center;gap:.6rem">
              <div class="lightbox-filename">${escapeHtml(fileDisplayNames[filename] || filename)}</div>
            </div>
            <div>
              <button class="btn-ghost" onclick="copyUrl('${src}')">Copier</button>
            </div>
          </div>
        </div>
      `;
      lightbox.classList.add('active');
      lightbox.setAttribute('aria-hidden','false');
      // lock scroll
      document.documentElement.style.overflow = 'hidden';
    }

    function closeLightbox(){
      lightbox.classList.remove('active');
      lightbox.setAttribute('aria-hidden','true');
      document.documentElement.style.overflow = '';
      lightboxInner.innerHTML = '';
      activeMedia = null;
    }

    // copy + toast
    function copyUrl(url){
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(url).then(()=> showToast('Lien copié !'));
      } else {
        // fallback
        const ta = document.createElement('textarea');ta.value=url;document.body.appendChild(ta);ta.select();
        try{ document.execCommand('copy'); showToast('Lien copié !'); }catch(e){ alert('Copie manuelle : ' + url); }
        ta.remove();
      }
    }

    function showToast(msg){
      const t = document.createElement('div'); t.className='toast'; t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(()=>{ t.remove(); }, 2200);
    }

    // filter button events
    document.querySelectorAll('.filter-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        loadGallery(btn.dataset.filter);
      });
    });

    // close when clicking background or Esc
    lightbox.addEventListener('click', (e)=>{
      if(e.target === lightbox) closeLightbox();
    });
    document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeLightbox(); });

    // small helper to escape html in text nodes
    function escapeHtml(str){
      return String(str).replace(/[&<>"']/g, function(m){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]); });
    }

    // initial render (les deux)
    loadGallery('all');
  </script>
</body>
</html>
