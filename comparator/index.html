<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comparateur GPU/CPU - Atlas Corporation</title>
<link rel="icon" type="image/x-icon" href="https://atlas-corporation.fr/favicon.ico">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root {
  --accent-blue: #3b82f6;
  --accent-green: #10b981;
  --accent-orange: #f59e0b;
  --bg-light: #f9fafb;
  --bg-dark: #111827;
  --text-light: #f9fafb;
  --text-dark: #111827;
  --card-light: #ffffff;
  --card-dark: #1f2937;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --radius: 0.8rem;
  --transition: all 0.3s ease;
  font-family: 'Inter', sans-serif;
}

body {
  background-color: var(--bg-light);
  color: var(--text-dark);
  transition: var(--transition);
  margin: 0;
  padding: 0;
}

@media (prefers-color-scheme: dark) {
  body {
    background-color: var(--bg-dark);
    color: var(--text-light);
  }
}

.container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 2rem;
}

.header {
  text-align: center;
  padding: 3rem 1rem;
  border-radius: var(--radius);
  background: linear-gradient(135deg, var(--accent-blue), var(--accent-green));
  color: white;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 3rem;
  margin-bottom: 0.5rem;
  font-weight: 900;
}

.controls {
  background: var(--card-light);
  margin-top: 2rem;
  padding: 2rem;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  transition: var(--transition);
}
@media (prefers-color-scheme: dark) {
  .controls {
    background: var(--card-dark);
  }
}

.filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
  margin-bottom: 1.5rem;
}

.filter-bar input {
  flex: 1;
  padding: 0.75rem 1rem;
  border: 2px solid #ccc;
  border-radius: var(--radius);
  font-size: 1rem;
  background: inherit;
  color: inherit;
}

.filter-buttons button {
  padding: 0.75rem 1.25rem;
  border: none;
  border-radius: var(--radius);
  cursor: pointer;
  font-weight: 600;
  transition: var(--transition);
}

.filter-buttons button:hover {
  transform: translateY(-2px);
  opacity: 0.9;
}

.btn-nvidia { background: #76b900; color: white; }
.btn-amd { background: #d72828; color: white; }
.btn-intel { background: #0071c5; color: white; }

select {
  width: 100%;
  padding: 0.75rem;
  border: 2px solid #ccc;
  border-radius: var(--radius);
  font-size: 1rem;
  background: inherit;
  color: inherit;
}

.btn-compare {
  margin-top: 1.5rem;
  padding: 1rem 2rem;
  background: var(--accent-blue);
  color: white;
  font-weight: 700;
  border: none;
  border-radius: var(--radius);
  cursor: pointer;
  transition: var(--transition);
}

.btn-compare:hover {
  background: var(--accent-green);
  transform: translateY(-3px);
}

.comparison-grid {
  display: grid;
  gap: 2rem;
  margin-top: 2rem;
}

.comparison-card {
  background: var(--card-light);
  border-radius: var(--radius);
  padding: 2rem;
  box-shadow: var(--shadow);
  transition: var(--transition);
}
@media (prefers-color-scheme: dark) {
  .comparison-card {
    background: var(--card-dark);
  }
}

.spec-card {
  margin-bottom: 1rem;
}

.spec-card h3 {
  margin-bottom: 0.5rem;
  font-weight: 700;
}

.spec-item {
  display: flex;
  justify-content: space-between;
  margin: 0.3rem 0;
}

.chart-container {
  height: 400px;
  margin-top: 2rem;
}

@media (max-width: 768px) {
  .chart-container { height: 300px; }
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>⚡ Comparateur GPU / CPU</h1>
    <p>Comparez les performances de vos composants en un clic</p>
  </div>

  <div class="controls">
    <h2>🔍 Filtres & Sélection</h2>
    <div class="filter-bar">
      <input type="text" id="gpuSearch" placeholder="Rechercher un GPU...">
      <div class="filter-buttons">
        <button class="btn-nvidia" onclick="filterGPU('NVIDIA')">NVIDIA</button>
        <button class="btn-amd" onclick="filterGPU('AMD')">AMD</button>
        <button class="btn-intel" onclick="filterGPU('INTEL')">INTEL</button>
      </div>
    </div>
    <div class="select-group">
      <label for="gpu1">GPU 1 :</label>
      <select id="gpu1"><option value="">Sélectionnez un GPU</option></select>
      <label for="gpu2">GPU 2 :</label>
      <select id="gpu2"><option value="">Sélectionnez un GPU</option></select>
    </div>

    <hr style="margin: 2rem 0; opacity: 0.2;">

    <div class="filter-bar">
      <input type="text" id="cpuSearch" placeholder="Rechercher un CPU...">
      <div class="filter-buttons">
        <button class="btn-intel" onclick="filterCPU('Intel')">Intel</button>
        <button class="btn-amd" onclick="filterCPU('AMD')">AMD</button>
      </div>
    </div>
    <div class="select-group">
      <label for="cpu1">CPU 1 :</label>
      <select id="cpu1"><option value="">Sélectionnez un CPU</option></select>
      <label for="cpu2">CPU 2 :</label>
      <select id="cpu2"><option value="">Sélectionnez un CPU</option></select>
    </div>

    <button class="btn-compare" onclick="compareComponents()">🚀 Comparer</button>
  </div>

  <div class="comparison-grid">
    <div class="comparison-card" id="gpuComparison">
      <h2>💻 Comparaison GPU</h2>
    </div>
    <div class="comparison-card" id="cpuComparison">
      <h2>🖥️ Comparaison CPU</h2>
    </div>
  </div>
</div>

<script>
let gpuData = [];
let cpuData = [];
let gpuCharts = [];
let cpuCharts = [];

async function loadData() {
  try {
    const [gpuRes, cpuRes] = await Promise.all([
      fetch('gpu_data.json'),
      fetch('cpu_data.json')
    ]);
    gpuData = await gpuRes.json();
    cpuData = await cpuRes.json();
    populateSelects();
  } catch (e) { console.error("Erreur de chargement:", e); }
}

function populateSelects() {
  const gpu1 = document.getElementById('gpu1');
  const gpu2 = document.getElementById('gpu2');
  const cpu1 = document.getElementById('cpu1');
  const cpu2 = document.getElementById('cpu2');
  gpuData.forEach((g,i)=> {
    const opt = `<option value="${i}">${g.name} (${g.vendor})</option>`;
    gpu1.innerHTML += opt; gpu2.innerHTML += opt;
  });
  cpuData.forEach((c,i)=>{
    const opt = `<option value="${i}">${c.name} (${c.vendor})</option>`;
    cpu1.innerHTML += opt; cpu2.innerHTML += opt;
  });
}

function filterGPU(vendor) {
  const select1 = document.getElementById('gpu1');
  const select2 = document.getElementById('gpu2');
  select1.innerHTML = '<option value="">Sélectionnez un GPU</option>';
  select2.innerHTML = '<option value="">Sélectionnez un GPU</option>';
  gpuData.forEach((g,i)=>{
    if(g.vendor.toUpperCase().includes(vendor.toUpperCase())) {
      const opt = `<option value="${i}">${g.name} (${g.vendor})</option>`;
      select1.innerHTML += opt; select2.innerHTML += opt;
    }
  });
}

function filterCPU(vendor) {
  const select1 = document.getElementById('cpu1');
  const select2 = document.getElementById('cpu2');
  select1.innerHTML = '<option value="">Sélectionnez un CPU</option>';
  select2.innerHTML = '<option value="">Sélectionnez un CPU</option>';
  cpuData.forEach((c,i)=>{
    if(c.vendor.toUpperCase().includes(vendor.toUpperCase())) {
      const opt = `<option value="${i}">${c.name} (${c.vendor})</option>`;
      select1.innerHTML += opt; select2.innerHTML += opt;
    }
  });
}

function compareComponents() {
  const g1 = gpuData[document.getElementById('gpu1').value];
  const g2 = gpuData[document.getElementById('gpu2').value];
  const c1 = cpuData[document.getElementById('cpu1').value];
  const c2 = cpuData[document.getElementById('cpu2').value];
  if(g1 && g2) showGPUComparison(g1,g2);
  if(c1 && c2) showCPUComparison(c1,c2);
}

function showGPUComparison(g1,g2){
  const container = document.getElementById('gpuComparison');
  container.innerHTML = `<h2>💻 Comparaison GPU</h2><div class="chart-container"><canvas id="gpuChart"></canvas></div>`;
  gpuCharts.forEach(c=>c.destroy());
  gpuCharts=[];

  const ctx = document.getElementById('gpuChart').getContext('2d');
  const labels = ['Cores','TMUs','ROPs','Base Clock (MHz)','Boost Clock (MHz)','VRAM (GB)'];
  const data1 = [g1.cores,g1.tmus,g1.rops,g1.base_clock,g1.boost_clock,g1.memory_size];
  const data2 = [g2.cores,g2.tmus,g2.rops,g2.base_clock,g2.boost_clock,g2.memory_size];

  gpuCharts.push(new Chart(ctx,{
    type:'bar',
    data:{labels,
      datasets:[
        {label:g1.name, data:data1, backgroundColor:'rgba(59,130,246,0.8)'},
        {label:g2.name, data:data2, backgroundColor:'rgba(16,185,129,0.8)'}
      ]},
    options:{
      responsive:true,
      plugins:{title:{display:true,text:'GPU Comparison',color:getComputedStyle(document.body).color}},
      scales:{
        y:{beginAtZero:true, ticks:{color:getComputedStyle(document.body).color}},
        x:{ticks:{color:getComputedStyle(document.body).color}}
      }
    }
  }));
}

function showCPUComparison(c1,c2){
  const container = document.getElementById('cpuComparison');
  container.innerHTML = `<h2>🖥️ Comparaison CPU</h2><div class="chart-container"><canvas id="cpuChart"></canvas></div>`;
  cpuCharts.forEach(c=>c.destroy());
  cpuCharts=[];

  const ctx = document.getElementById('cpuChart').getContext('2d');
  const labels = ['Cores','Threads','Base Clock (GHz)','Boost Clock (GHz)','TDP (W)'];
  const data1 = [c1.cores,c1.threads,c1.base_clock,c1.boost_clock,c1.tdp];
  const data2 = [c2.cores,c2.threads,c2.base_clock,c2.boost_clock,c2.tdp];

  cpuCharts.push(new Chart(ctx,{
    type:'bar',
    data:{labels,
      datasets:[
        {label:c1.name, data:data1, backgroundColor:'rgba(59,130,246,0.8)'},
        {label:c2.name, data:data2, backgroundColor:'rgba(245,158,11,0.8)'}
      ]},
    options:{
      responsive:true,
      plugins:{title:{display:true,text:'CPU Comparison',color:getComputedStyle(document.body).color}},
      scales:{
        y:{beginAtZero:true, ticks:{color:getComputedStyle(document.body).color}},
        x:{ticks:{color:getComputedStyle(document.body).color}}
      }
    }
  }));
}

loadData();
</script>
</body>
</html>
