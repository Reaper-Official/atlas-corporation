<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comparateur GPU/CPU - Atlas Corporation</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root {
  --accent-blue: #3b82f6;
  --accent-green: #16a34a;
  --accent-red: #dc2626;
  --bg: #ffffff;
  --text: #000000;
  --card: #f9fafb;
  --border: #e5e7eb;
  --radius: 10px;
  --shadow: 0 4px 8px rgba(0,0,0,0.1);
  font-family: 'Inter', sans-serif;
}

body { background: var(--bg); color: var(--text); margin: 0; padding: 2rem; }
h1 { text-align: center; }
.container { max-width: 1300px; margin: 0 auto; }
.card {
  background: var(--card); padding: 2rem; border-radius: var(--radius);
  box-shadow: var(--shadow); margin-top: 2rem;
}
select, input, button {
  padding: 0.6rem 1rem; border: 1px solid var(--border);
  border-radius: var(--radius); font-size: 1rem;
}
button { cursor: pointer; background: var(--accent-blue); color: white; font-weight: bold; }
button:hover { background: var(--accent-green); }
.chart-container { height: 350px; margin-top: 2rem; }
</style>
</head>

<body>
<div class="container">
  <h1>⚡ Comparateur GPU / CPU</h1>

  <div class="card">
    <h2>💻 Sélection GPU</h2>
    <select id="gpu1"><option value="">-- GPU 1 --</option></select>
    <select id="gpu2"><option value="">-- GPU 2 --</option></select>
    <button onclick="compareGPU()">Comparer</button>
  </div>

  <div class="card" id="gpuComparison" style="display:none;">
    <h2>📊 Comparaison GPU</h2>
    <div class="chart-container"><canvas id="gpuChart1"></canvas></div>
    <div class="chart-container"><canvas id="gpuChart2"></canvas></div>
    <div class="chart-container"><canvas id="gpuChart3"></canvas></div>
  </div>
</div>

<script>
let gpuData = [];

async function loadData() {
  try {
    const res = await fetch('gpu_data.json');
    gpuData = await res.json();
    populateSelects();
  } catch (err) {
    alert("Erreur de chargement du fichier gpu_data.json");
    console.error(err);
  }
}

function populateSelects() {
  const gpu1 = document.getElementById('gpu1');
  const gpu2 = document.getElementById('gpu2');
  gpuData.forEach((gpu, i) => {
    const opt = `<option value="${i}">${gpu.name}</option>`;
    gpu1.innerHTML += opt;
    gpu2.innerHTML += opt;
  });
}

function extractVRAM(memory) {
  const match = memory?.match(/(\d+)\s*GB/i);
  return match ? parseInt(match[1]) : 0;
}

function extractYear(dateStr) {
  const match = dateStr?.match(/(\d{4})/);
  return match ? parseInt(match[1]) : 0;
}

let gpuCharts = [];

function compareGPU() {
  const idx1 = document.getElementById('gpu1').value;
  const idx2 = document.getElementById('gpu2').value;
  if (idx1 === "" || idx2 === "") return alert("Sélectionnez deux GPU");
  
  const g1 = gpuData[idx1];
  const g2 = gpuData[idx2];

  const vram1 = extractVRAM(g1.memory);
  const vram2 = extractVRAM(g2.memory);
  const year1 = extractYear(g1.release_date);
  const year2 = extractYear(g2.release_date);

  document.getElementById('gpuComparison').style.display = 'block';
  gpuCharts.forEach(c => c.destroy());
  gpuCharts = [];

  // Chart 1 - VRAM
  gpuCharts.push(new Chart(document.getElementById('gpuChart1'), {
    type: 'bar',
    data: {
      labels: ['Mémoire (GB)'],
      datasets: [
        { label: g1.name, data: [vram1], backgroundColor: 'rgba(59,130,246,0.8)' },
        { label: g2.name, data: [vram2], backgroundColor: 'rgba(16,185,129,0.8)' }
      ]
    },
    options: { plugins: { title: { display: true, text: 'Mémoire Vidéo (VRAM)' } } }
  }));

  // Chart 2 - Année de sortie
  gpuCharts.push(new Chart(document.getElementById('gpuChart2'), {
    type: 'bar',
    data: {
      labels: ['Année de sortie'],
      datasets: [
        { label: g1.name, data: [year1], backgroundColor: 'rgba(234,179,8,0.8)' },
        { label: g2.name, data: [year2], backgroundColor: 'rgba(220,38,38,0.8)' }
      ]
    },
    options: { plugins: { title: { display: true, text: 'Année de Sortie' } } }
  }));

  // Chart 3 - Répartition mémoire / génération (Pie)
  gpuCharts.push(new Chart(document.getElementById('gpuChart3'), {
    type: 'pie',
    data: {
      labels: [g1.name, g2.name],
      datasets: [{
        data: [vram1 * year1, vram2 * year2],
        backgroundColor: ['rgba(59,130,246,0.7)', 'rgba(16,185,129,0.7)']
      }]
    },
    options: { plugins: { title: { display: true, text: 'Indice combiné VRAM × Génération' } } }
  }));
}

loadData();
</script>
</body>
</html>
