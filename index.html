<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

        <!-- Google tag (gtag.js) -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-JDPE895T9J"></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());

            gtag('config', 'G-JDPE895T9J');

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reaper AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: 
                radial-gradient(circle at 30% 70%, rgba(20, 20, 30, 0.8) 0%, transparent 50%),
                radial-gradient(circle at 70% 30%, rgba(30, 20, 40, 0.6) 0%, transparent 50%),
                linear-gradient(135deg, #000000 0%, #0a0a0a 50%, #050505 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Particules animées en arrière-plan */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            background: rgba(100, 100, 150, 0.1);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
            box-shadow: 0 0 3px rgba(150, 150, 200, 0.2);
        }

        .particle:nth-child(odd) {
            animation-direction: alternate;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
                opacity: 0.3;
            }
            50% {
                transform: translateY(-20px) rotate(180deg);
                opacity: 0.8;
            }
        }

        /* Container principal */
        .main-container {
            position: relative;
            z-index: 10;
            text-align: center;
            animation: fadeInUp 2s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Logo/Titre principal */
        .logo-container {
            position: relative;
            display: inline-block;
            margin-bottom: 40px;
        }

        .logo-bg {
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid rgba(80, 80, 120, 0.6);
            border-radius: 6px;
            padding: 30px 60px;
            backdrop-filter: blur(15px);
            box-shadow: 
                0 0 30px rgba(0, 0, 0, 0.8),
                inset 0 0 30px rgba(20, 20, 30, 0.5);
            position: relative;
            overflow: hidden;
            animation: darkGlow 4s ease-in-out infinite alternate;
        }

        @keyframes darkGlow {
            from {
                box-shadow: 
                    0 0 30px rgba(0, 0, 0, 0.8),
                    inset 0 0 30px rgba(20, 20, 30, 0.5);
                border-color: rgba(80, 80, 120, 0.6);
            }
            to {
                box-shadow: 
                    0 0 50px rgba(40, 40, 60, 0.4),
                    0 0 80px rgba(0, 0, 0, 0.9),
                    inset 0 0 40px rgba(10, 10, 20, 0.7);
                border-color: rgba(120, 120, 160, 0.8);
            }
        }

        .logo-bg::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(60, 60, 80, 0.1), transparent);
            animation: shine 6s ease-in-out infinite;
        }

        @keyframes shine {
            0% {
                transform: translateX(-100%) translateY(-100%) rotate(45deg);
            }
            50% {
                transform: translateX(100%) translateY(100%) rotate(45deg);
            }
            100% {
                transform: translateX(-100%) translateY(-100%) rotate(45deg);
            }
        }

        .logo-text {
            font-size: 4rem;
            font-weight: bold;
            color: #cccccc;
            letter-spacing: 3px;
            position: relative;
            z-index: 2;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            overflow: hidden;
            animation: hideOriginal 4s ease-in-out infinite;
        }

        /* Animation pour masquer le texte original pendant le glitch */
        @keyframes hideOriginal {
            0%, 70% {
                color: #cccccc;
            }
            75%, 85% {
                color: transparent;
            }
            100% {
                color: #cccccc;
            }
        }

        .logo-text::before,
        .logo-text::after {
            content: "REAPER AI";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
            opacity: 0;
        }

        .logo-text::before {
            clip-path: polygon(0 0, 100% 0, 100% 40%, 0 45%);
            animation: glitchTop 4s ease-in-out infinite;
            z-index: 3;
        }

        .logo-text::after {
            clip-path: polygon(0 55%, 100% 60%, 100% 100%, 0 100%);
            animation: glitchBottom 4s ease-in-out infinite;
            z-index: 3;
        }

        @keyframes glitchTop {
            0%, 70% {
                opacity: 0;
                transform: translateX(0);
                color: #ffffff;
                text-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
            }
            72% {
                opacity: 1;
                transform: translateX(-15px);
                color: #ffffff;
                text-shadow: 
                    0 0 20px rgba(255, 255, 255, 1),
                    2px 0 0 rgba(0, 255, 255, 0.8),
                    -2px 0 0 rgba(255, 0, 255, 0.8);
            }
            74% {
                opacity: 1;
                transform: translateX(8px);
                color: #ffffff;
                text-shadow: 
                    0 0 25px rgba(255, 255, 255, 1),
                    3px 0 0 rgba(255, 0, 255, 0.9),
                    -3px 0 0 rgba(0, 255, 255, 0.9);
            }
            76% {
                opacity: 1;
                transform: translateX(-22px);
                color: #ffffff;
                text-shadow: 
                    0 0 30px rgba(255, 255, 255, 1),
                    4px 0 0 rgba(0, 255, 255, 1),
                    -4px 0 0 rgba(255, 0, 255, 1);
            }
            78% {
                opacity: 1;
                transform: translateX(12px);
                color: #ffffff;
                text-shadow: 
                    0 0 20px rgba(255, 255, 255, 1),
                    2px 0 0 rgba(255, 0, 255, 0.8),
                    -2px 0 0 rgba(0, 255, 255, 0.8);
            }
            80% {
                opacity: 1;
                transform: translateX(-8px);
                color: #ffffff;
                text-shadow: 
                    0 0 15px rgba(255, 255, 255, 0.9),
                    1px 0 0 rgba(0, 255, 255, 0.7),
                    -1px 0 0 rgba(255, 0, 255, 0.7);
            }
            85% {
                opacity: 0;
                transform: translateX(0);
                color: #ffffff;
                text-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
            }
            100% {
                opacity: 0;
                transform: translateX(0);
                color: #ffffff;
                text-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
            }
        }

        @keyframes glitchBottom {
            0%, 70% {
                opacity: 0;
                transform: translateX(0);
                color: #ffffff;
                text-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
            }
            72% {
                opacity: 1;
                transform: translateX(18px);
                color: #ffffff;
                text-shadow: 
                    0 0 20px rgba(255, 255, 255, 1),
                    -2px 0 0 rgba(255, 0, 255, 0.8),
                    2px 0 0 rgba(0, 255, 255, 0.8);
            }
            74% {
                opacity: 1;
                transform: translateX(-12px);
                color: #ffffff;
                text-shadow: 
                    0 0 25px rgba(255, 255, 255, 1),
                    -3px 0 0 rgba(0, 255, 255, 0.9),
                    3px 0 0 rgba(255, 0, 255, 0.9);
            }
            76% {
                opacity: 1;
                transform: translateX(25px);
                color: #ffffff;
                text-shadow: 
                    0 0 30px rgba(255, 255, 255, 1),
                    -4px 0 0 rgba(255, 0, 255, 1),
                    4px 0 0 rgba(0, 255, 255, 1);
            }
            78% {
                opacity: 1;
                transform: translateX(-15px);
                color: #ffffff;
                text-shadow: 
                    0 0 20px rgba(255, 255, 255, 1),
                    -2px 0 0 rgba(0, 255, 255, 0.8),
                    2px 0 0 rgba(255, 0, 255, 0.8);
            }
            80% {
                opacity: 1;
                transform: translateX(10px);
                color: #ffffff;
                text-shadow: 
                    0 0 15px rgba(255, 255, 255, 0.9),
                    -1px 0 0 rgba(255, 0, 255, 0.7),
                    1px 0 0 rgba(0, 255, 255, 0.7);
            }
            85% {
                opacity: 0;
                transform: translateX(0);
                color: #ffffff;
                text-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
            }
            100% {
                opacity: 0;
                transform: translateX(0);
                color: #ffffff;
                text-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
            }
        }

        /* Ligne de séparation glitch */
        .logo-container::after {
            content: '';
            position: absolute;
            top: 50%;
            left: -10%;
            width: 120%;
            height: 1px;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(255, 255, 255, 0.9) 20%, 
                rgba(255, 255, 255, 1) 50%, 
                rgba(255, 255, 255, 0.9) 80%, 
                transparent 100%);
            transform: translateY(-1px);
            opacity: 0;
            animation: glitchLine 4s ease-in-out infinite;
            z-index: 4;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        @keyframes glitchLine {
            0%, 70% {
                opacity: 0;
                transform: translateY(-1px) scaleX(0);
            }
            72% {
                opacity: 1;
                transform: translateY(-1px) scaleX(1);
                background: linear-gradient(90deg, 
                    transparent 0%, 
                    rgba(255, 255, 255, 1) 20%, 
                    rgba(0, 255, 255, 0.8) 50%, 
                    rgba(255, 255, 255, 1) 80%, 
                    transparent 100%);
            }
            76% {
                opacity: 1;
                transform: translateY(-1px) scaleX(1);
                background: linear-gradient(90deg, 
                    transparent 0%, 
                    rgba(255, 0, 255, 0.8) 20%, 
                    rgba(255, 255, 255, 1) 50%, 
                    rgba(0, 255, 255, 0.8) 80%, 
                    transparent 100%);
            }
            80% {
                opacity: 0.8;
                transform: translateY(-1px) scaleX(1);
                background: linear-gradient(90deg, 
                    transparent 0%, 
                    rgba(255, 255, 255, 0.9) 20%, 
                    rgba(255, 255, 255, 1) 50%, 
                    rgba(255, 255, 255, 0.9) 80%, 
                    transparent 100%);
            }
            85%, 100% {
                opacity: 0;
                transform: translateY(-1px) scaleX(0);
            }
        }

        /* Indicateur de chargement */
        .loading-indicator {
            margin-top: 30px;
            animation: slideIn 1s ease-out 1s both;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading-bar {
            width: 300px;
            height: 4px;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid rgba(80, 80, 120, 0.4);
            border-radius: 2px;
            margin: 0 auto 15px;
            overflow: hidden;
            position: relative;
        }

        .loading-fill {
            height: 100%;
            background: linear-gradient(90deg, #333333, #666666, #999999);
            border-radius: 2px;
            animation: darkLoading 4s ease-in-out infinite;
            box-shadow: 0 0 8px rgba(100, 100, 100, 0.3);
        }

        @keyframes darkLoading {
            0% {
                width: 0%;
                transform: translateX(-100%);
                background: linear-gradient(90deg, #222222, #444444);
            }
            50% {
                width: 100%;
                transform: translateX(0%);
                background: linear-gradient(90deg, #444444, #888888);
            }
            100% {
                width: 0%;
                transform: translateX(100%);
                background: linear-gradient(90deg, #666666, #333333);
            }
        }

        .loading-text {
            color: #888888;
            font-size: 1.1rem;
            letter-spacing: 2px;
            font-family: 'Courier New', monospace;
            animation: darkBlink 3s ease-in-out infinite;
            text-shadow: 0 0 5px rgba(100, 100, 100, 0.3);
            text-transform: uppercase;
        }

        @keyframes darkBlink {
            0%, 60% {
                opacity: 1;
                text-shadow: 0 0 5px rgba(100, 100, 100, 0.3);
            }
            61%, 100% {
                opacity: 0.4;
                text-shadow: 0 0 3px rgba(60, 60, 60, 0.2);
            }
        }

        /* Effets de curseur */
        .cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(80, 80, 120, 0.2);
            pointer-events: none;
            z-index: 1000;
            animation: darkCursor 2s ease-in-out infinite;
            border: 1px solid rgba(100, 100, 150, 0.3);
        }

        @keyframes darkCursor {
            0%, 100% {
                transform: scale(1);
                background: rgba(80, 80, 120, 0.2);
            }
            50% {
                transform: scale(1.3);
                background: rgba(120, 120, 160, 0.3);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .logo-text {
                font-size: 2.5rem;
            }
            
            .logo-bg {
                padding: 20px 40px;
            }
            
            .loading-bar {
                width: 250px;
            }
        }
    </style>
</head>
<body>
    <!-- Particules animées -->
    <div class="particles"></div>

    <!-- Curseur personnalisé -->
    <div class="cursor"></div>

    <!-- Container principal -->
    <div class="main-container">
        <div class="logo-container">
            <div class="logo-bg">
                <div class="logo-text">Reaper AI</div>
            </div>
        </div>

        <div class="loading-indicator">
            <div class="loading-bar">
                <div class="loading-fill"></div>
            </div>
            <div class="loading-text">INITIALISATION...</div>
        </div>
    </div>

    <script>
        // Génération des particules
        function createParticles() {
            const particlesContainer = document.querySelector('.particles');
            const particleCount = 50;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                // Taille aléatoire
                const size = Math.random() * 4 + 1;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                
                // Position aléatoire
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                
                // Délai d'animation aléatoire
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (Math.random() * 4 + 4) + 's';
                
                particlesContainer.appendChild(particle);
            }
        }

        // Curseur personnalisé
        function setupCustomCursor() {
            const cursor = document.querySelector('.cursor');
            
            document.addEventListener('mousemove', (e) => {
                cursor.style.left = e.clientX - 10 + 'px';
                cursor.style.top = e.clientY - 10 + 'px';
            });
        }

        // Effet de texte changeant
        function animateLoadingText() {
            const loadingText = document.querySelector('.loading-text');
            const texts = ['Reaper Advanced Interface...', 'Reaper Artificial Intelligence...', 'Reaper Autonomous Infrastructure...', 'PRÊT À FONCTIONNER'];
            let currentIndex = 0;

            setInterval(() => {
                loadingText.style.opacity = '0';
                setTimeout(() => {
                    currentIndex = (currentIndex + 1) % texts.length;
                    loadingText.textContent = texts[currentIndex];
                    loadingText.style.opacity = '1';
                }, 300);
            }, 2000);
        }

        // Redirection après 15 secondes
        function setupRedirection() {
            setTimeout(() => {
                // Effet de fade out avant la redirection
                document.body.style.transition = 'opacity 1s ease-out';
                document.body.style.opacity = '0';
                
                setTimeout(() => {
                    // Remplacez 'main.html' par le nom de votre fichier cible
                    window.location.href = 'main.html';
                }, 2000); // Attend 2 seconde pour le fade out
            }, 8000); // 8 secondes
        }

        // Initialisation
        document.addEventListener('DOMContentLoaded', () => {
            createParticles();
            setupCustomCursor();
            animateLoadingText();
            setupRedirection();
        });
    </script>
</body>
</html>
